<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>私域CRM</title>
  <style>
    :root{--bg:#f5f7fb;--card:#fff;--line:#e5e7eb;--text:#1f2937;--sub:#6b7280;--p:#3b82f6;--ok:#16a34a;--warn:#d97706;--danger:#dc2626}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text)}
    .wrap{max-width:1280px;margin:0 auto;padding:16px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
    .title{font-size:22px;font-weight:700}.sub{font-size:12px;color:var(--sub)}
    .row{display:grid;gap:10px}.r2{grid-template-columns:1fr 1fr}.r3{grid-template-columns:repeat(3,1fr)}.r4{grid-template-columns:repeat(4,1fr)}
    .field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:var(--sub)}
    input,textarea,select{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:14px}
    textarea{min-height:76px;resize:vertical}
    .btns{display:flex;gap:8px;flex-wrap:wrap}
    button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 12px;cursor:pointer}
    .primary{background:var(--p);color:#fff;border-color:var(--p)} .ok{background:var(--ok);color:#fff;border-color:var(--ok)}
    .warn{background:var(--warn);color:#fff;border-color:var(--warn)} .danger{background:var(--danger);color:#fff;border-color:var(--danger)}
    .hidden{display:none !important}
    table{width:100%;border-collapse:collapse;background:#fff} th,td{border-bottom:1px solid var(--line);padding:8px;font-size:13px;text-align:left;vertical-align:top}
    th{background:#f8fafc}.kpi{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff}.kpi .n{font-size:24px;font-weight:800}
    .note{padding:10px;border-radius:8px;margin-bottom:8px;font-size:13px}
    .oknote{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46}.errnote{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
    .split{display:flex;gap:12px}.split>div{flex:1}
    .badge{display:inline-block;padding:2px 8px;border-radius:999px;background:#eef2ff;font-size:12px;margin-right:4px}
    @media(max-width:980px){.r2,.r3,.r4{grid-template-columns:1fr}.split{flex-direction:column}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card top">
      <div>
        <div class="title">私域CRM + 利润工具</div>
        <div class="sub" id="statusLine">未登录</div>
      </div>
      <div class="btns">
        <button id="btnExportCustomers">导出客户CSV</button>
        <button id="btnExportFollows">导出跟进CSV</button>
        <button id="btnExportBackup" class="warn hidden">导出系统备份</button>
        <button id="btnLogout" class="danger hidden">退出登录</button>
      </div>
    </div>

    <div id="bootstrapCard" class="card hidden">
      <h3>创建第一管理员</h3>
      <div class="sub">仅首次使用需要。此账号拥有老板权限。</div>
      <div id="bootstrapNotice"></div>
      <div class="row r2">
        <div class="field"><label>管理员用户名</label><input id="bootUser" /></div>
        <div class="field"><label>管理员密码</label><input id="bootPass" type="password" /></div>
      </div>
      <div class="btns" style="margin-top:8px"><button id="btnBootstrap" class="primary">创建管理员</button></div>
    </div>

    <div id="authCard" class="card hidden">
      <h3>登录</h3>
      <div id="authNotice"></div>
      <div class="row r2">
        <div class="field"><label>用户名</label><input id="loginUser" /></div>
        <div class="field"><label>密码</label><input id="loginPass" type="password" /></div>
      </div>
      <div class="btns" style="margin-top:8px"><button id="btnLogin" class="primary">登录</button></div>
    </div>

    <div id="app" class="hidden row">
      <div class="row r4">
        <div class="kpi"><div class="sub">客户总数</div><div class="n" id="kTotal">0</div></div>
        <div class="kpi"><div class="sub">我的客户</div><div class="n" id="kMine">0</div></div>
        <div class="kpi"><div class="sub">7天内到期</div><div class="n" id="kDue">0</div></div>
        <div class="kpi"><div class="sub">总金额</div><div class="n" id="kAmount">0</div></div>
      </div>

      <div class="split">
        <div class="card">
          <h3>新增客户</h3>
          <div id="createNotice"></div>
          <div class="row r3">
            <div class="field"><label>姓名</label><input id="cName"></div>
            <div class="field"><label>电话</label><input id="cPhone"></div>
            <div class="field"><label>微信号</label><input id="cWechat"></div>
          </div>
          <div class="row r3">
            <div class="field"><label>城市</label><input id="cCity"></div>
            <div class="field"><label>负责人</label><input id="cOwner"></div>
            <div class="field"><label>渠道</label><input id="cChannel"></div>
          </div>
          <div class="row r3">
            <div class="field"><label>等级</label><input id="cLevel"></div>
            <div class="field"><label>状态</label><input id="cStatus" placeholder="New / Following / Hot / Closed"></div>
            <div class="field"><label>来源</label><input id="cSource"></div>
          </div>
          <div class="row r3">
            <div class="field"><label>标签（逗号分隔）</label><input id="cTags"></div>
            <div class="field"><label>下次跟进日期</label><input id="cNextDate" type="date"></div>
            <div class="field"><label>金额</label><input id="cAmount" type="number" step="0.01"></div>
          </div>
          <div class="field"><label>备注</label><textarea id="cNote"></textarea></div>
          <div class="btns"><button class="ok" id="btnCreateCustomer">保存客户</button><button id="btnClearCustomer">清空</button></div>
        </div>

        <div class="card">
          <h3>利润测算</h3>
          <div class="row r2">
            <div class="field"><label>售价</label><input id="pSell" type="number" step="0.01"></div>
            <div class="field"><label>供货价</label><input id="pSupply" type="number" step="0.01"></div>
          </div>
          <div class="row r2">
            <div class="field"><label>平台佣金 %</label><input id="pComm" type="number" step="0.01"></div>
            <div class="field"><label>主播佣金 %</label><input id="pAnchor" type="number" step="0.01"></div>
          </div>
          <div class="row r3">
            <div class="field"><label>运费 / 单</label><input id="pShip" type="number" step="0.01"></div>
            <div class="field"><label>包装费 / 单</label><input id="pPack" type="number" step="0.01"></div>
            <div class="field"><label>退货率 %</label><input id="pReturn" type="number" step="0.01"></div>
          </div>
          <div class="row r2">
            <div class="field"><label>固定成本</label><input id="pFixed" type="number" step="0.01" value="0"></div>
            <div class="field"><label>目标销量</label><input id="pQty" type="number" step="1" value="100"></div>
          </div>
          <div class="btns"><button class="primary" id="btnCalc">计算</button><button id="btnCalcReset">重置</button></div>
          <div class="row r3" style="margin-top:10px">
            <div class="kpi"><div class="sub">单件毛利</div><div class="n" id="outGross">0</div></div>
            <div class="kpi"><div class="sub">单件净利</div><div class="n" id="outNet">0</div></div>
            <div class="kpi"><div class="sub">保本销量</div><div class="n" id="outBreak">0</div></div>
          </div>
          <div class="kpi" style="margin-top:10px"><div class="sub">按目标销量预计净利润</div><div class="n" id="outQtyProfit">0</div></div>
        </div>
      </div>

      <div id="bossPanel" class="card hidden">
        <h3>团队管理（老板）</h3>
        <div id="teamNotice"></div>
        <div class="row r3">
          <div class="field"><label>新用户名</label><input id="uName"></div>
          <div class="field"><label>密码</label><input id="uPass" type="password"></div>
          <div class="field"><label>角色</label><select id="uRole"><option value="staff">staff</option><option value="boss">boss</option></select></div>
        </div>
        <div class="btns"><button class="primary" id="btnCreateUser">创建账号</button></div>
        <hr style="border:none;border-top:1px solid var(--line);margin:12px 0">
        <div class="row r2">
          <div class="field"><label>重置用户名</label><input id="rUser"></div>
          <div class="field"><label>新密码</label><input id="rPass" type="password"></div>
        </div>
        <div class="btns"><button class="warn" id="btnResetPass">重置密码</button></div>
      </div>

      <div class="card">
        <h3>筛选</h3>
        <div class="row r4">
          <div class="field"><label>关键词</label><input id="fKeyword" placeholder="姓名/电话/微信/城市/负责人/渠道"></div>
          <div class="field"><label>负责人</label><input id="fOwner"></div>
          <div class="field"><label>状态</label><input id="fStatus"></div>
          <div class="field"><label>城市</label><input id="fCity"></div>
        </div>
        <div class="btns">
          <button id="btnApplyFilter" class="primary">应用筛选</button>
          <button id="btnClearFilter">清空筛选</button>
        </div>
      </div>

      <div class="card">
        <h3>客户列表</h3>
        <div style="overflow:auto">
          <table id="customerTable">
            <thead><tr><th>ID</th><th>姓名</th><th>电话</th><th>微信</th><th>城市</th><th>负责人</th><th>状态</th><th>金额</th><th>下次跟进</th><th>标签</th><th>备注</th><th>操作</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <div class="split">
        <div class="card">
          <h3>新增跟进</h3>
          <div id="followNotice"></div>
          <div class="row r2">
            <div class="field"><label>客户ID</label><input id="fCustomerId" type="number"></div>
            <div class="field"><label>跟进日期</label><input id="fDate" type="date"></div>
          </div>
          <div class="row r2">
            <div class="field"><label>跟进结果</label><input id="fResult"></div>
            <div class="field"><label>下次跟进日期</label><input id="fNextDate2" type="date"></div>
          </div>
          <div class="field"><label>跟进内容</label><textarea id="fContent"></textarea></div>
          <div class="field"><label>更新客户状态</label><input id="fStatus2" placeholder="Following / Hot / Closed"></div>
          <div class="btns"><button id="btnAddFollow" class="ok">保存跟进</button><button id="btnClearFollow">清空</button></div>
        </div>
        <div class="card">
          <h3>最近跟进</h3>
          <div style="overflow:auto">
            <table id="followTable">
              <thead><tr><th>ID</th><th>客户</th><th>日期</th><th>结果</th><th>下次</th><th>内容</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API = "";
    let token = localStorage.getItem("crm_token") || "";
    let me = null;
    let customers = [];
    let follows = [];
    const $ = (id) => document.getElementById(id);
    const today = () => new Date().toISOString().slice(0, 10);
    const toNum = (v) => Number(v || 0);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (m) => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[m]));

    function notice(el, text, ok = true) {
      el.innerHTML = text ? `<div class="note ${ok ? "oknote" : "errnote"}">${esc(text)}</div>` : "";
    }

    async function req(path, options = {}) {
      const headers = Object.assign({ "Content-Type": "application/json" }, options.headers || {});
      if (token) headers.Authorization = "Bearer " + token;
      const res = await fetch(API + path, Object.assign({}, options, { headers }));
      const ct = res.headers.get("content-type") || "";
      const body = ct.includes("application/json") ? await res.json() : await res.text();
      if (!res.ok) throw new Error(body && body.error ? body.error : `HTTP ${res.status}`);
      return body;
    }

    function updateStatus() {
      const t = me ? `已登录：${me.username}（${me.role}）` : "未登录";
      $("statusLine").textContent = `${t}  ${new Date().toLocaleString()}`;
    }

    function showAuth(bootstrap) {
      $("app").classList.add("hidden");
      $("btnLogout").classList.add("hidden");
      $("btnExportBackup").classList.add("hidden");
      $("bootstrapCard").classList.toggle("hidden", !bootstrap);
      $("authCard").classList.toggle("hidden", bootstrap);
      updateStatus();
    }

    function showApp() {
      $("bootstrapCard").classList.add("hidden");
      $("authCard").classList.add("hidden");
      $("app").classList.remove("hidden");
      $("btnLogout").classList.remove("hidden");
      $("bossPanel").classList.toggle("hidden", !me || me.role !== "boss");
      $("btnExportBackup").classList.toggle("hidden", !me || me.role !== "boss");
      updateStatus();
    }

    function filtered() {
      const kw = $("fKeyword").value.trim().toLowerCase();
      const owner = $("fOwner").value.trim().toLowerCase();
      const status = $("fStatus").value.trim().toLowerCase();
      const city = $("fCity").value.trim().toLowerCase();
      return customers.filter((c) => {
        const blob = `${c.name} ${c.phone} ${c.wechat||""} ${c.city||""} ${c.owner||""} ${c.channel||""}`.toLowerCase();
        if (kw && !blob.includes(kw)) return false;
        if (owner && !String(c.owner || "").toLowerCase().includes(owner)) return false;
        if (status && !String(c.status || "").toLowerCase().includes(status)) return false;
        if (city && !String(c.city || "").toLowerCase().includes(city)) return false;
        return true;
      });
    }

    function renderKpi(arr) {
      $("kTotal").textContent = customers.length;
      $("kMine").textContent = customers.filter((c) => me && c.owner === me.username).length;
      $("kDue").textContent = arr.filter((c) => c.nextDate && c.nextDate <= addDays(today(), 7)).length;
      $("kAmount").textContent = arr.reduce((s, c) => s + Number(c.amount || 0), 0).toFixed(2);
    }

    function addDays(dateStr, n) {
      const d = new Date((dateStr || today()) + "T00:00:00");
      d.setDate(d.getDate() + n);
      return d.toISOString().slice(0, 10);
    }

    function renderCustomers() {
      const arr = filtered();
      const tb = $("customerTable").querySelector("tbody");
      tb.innerHTML = arr.map((c) => `
        <tr>
          <td>${c.id}</td><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${esc(c.wechat||"")}</td><td>${esc(c.city||"")}</td>
          <td>${esc(c.owner||"")}</td><td>${esc(c.status||"")}</td><td>${Number(c.amount||0).toFixed(2)}</td><td>${esc(c.nextDate||"")}</td>
          <td>${(c.tags||[]).map((t)=>`<span class="badge">${esc(t)}</span>`).join("")}</td><td>${esc(c.note||"")}</td>
          <td><button data-del="${c.id}" class="danger">删除</button></td>
        </tr>
      `).join("");
      tb.querySelectorAll("button[data-del]").forEach((b) => {
        b.onclick = async () => {
          if (!confirm("确认删除该客户？")) return;
          try { await req(`/api/customers/${b.dataset.del}`, { method: "DELETE" }); await reloadData(); } catch (e) { alert(e.message); }
        };
      });
      renderKpi(arr);
    }

    function renderFollows() {
      const tb = $("followTable").querySelector("tbody");
      tb.innerHTML = follows.map((f) => `
        <tr><td>${f.id}</td><td>${esc(f.customerName||"")}</td><td>${esc(f.date||"")}</td><td>${esc(f.result||"")}</td><td>${esc(f.nextDate||"")}</td><td>${esc(f.content||"")}</td></tr>
      `).join("");
    }

    async function reloadData() {
      const [c, f] = await Promise.all([req("/api/customers"), req("/api/follows")]);
      customers = c.customers || [];
      follows = f.follows || [];
      renderCustomers();
      renderFollows();
    }

    function exportCsv(name, rows) {
      if (!rows.length) return alert("暂无可导出数据");
      const keys = Object.keys(rows[0]);
      const lines = [keys.join(",")].concat(rows.map((r) => keys.map((k) => `"${String(r[k] ?? "").replaceAll("\"", "\"\"")}"`).join(",")));
      const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8;" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function calcProfit() {
      const sell = toNum($("pSell").value), supply = toNum($("pSupply").value), comm = toNum($("pComm").value)/100, anchor = toNum($("pAnchor").value)/100;
      const ship = toNum($("pShip").value), pack = toNum($("pPack").value), ret = toNum($("pReturn").value)/100, fixed = toNum($("pFixed").value), qty = Math.max(0, Math.floor(toNum($("pQty").value)));
      const gross = sell - supply, varCost = sell*comm + sell*anchor + ship + pack + sell*ret, net = sell - supply - varCost;
      $("outGross").textContent = gross.toFixed(2); $("outNet").textContent = net.toFixed(2); $("outBreak").textContent = net > 0 ? String(Math.ceil(fixed/net)) : "0"; $("outQtyProfit").textContent = (qty*net-fixed).toFixed(2);
    }

    async function boot() {
      try {
        const s = await req("/api/system-status");
        if (!s.hasUsers) return showAuth(true);
        if (!token) return showAuth(false);
        const m = await req("/api/me");
        me = m.user;
        showApp();
        await reloadData();
      } catch (e) {
        showAuth(false);
        notice($("authNotice"), e.message, false);
      }
    }

    $("btnBootstrap").onclick = async () => {
      try {
        await req("/api/bootstrap-admin", { method: "POST", body: JSON.stringify({ username: $("bootUser").value.trim(), password: $("bootPass").value.trim() }) });
        notice($("bootstrapNotice"), "管理员创建成功，请登录");
        showAuth(false);
      } catch (e) { notice($("bootstrapNotice"), e.message, false); }
    };
    $("btnLogin").onclick = async () => {
      try {
        const r = await req("/api/login", { method: "POST", body: JSON.stringify({ username: $("loginUser").value.trim(), password: $("loginPass").value.trim() }) });
        token = r.token; localStorage.setItem("crm_token", token); me = r.user; showApp(); await reloadData();
      } catch (e) { notice($("authNotice"), e.message, false); }
    };
    $("btnLogout").onclick = async () => {
      try { await req("/api/logout", { method: "POST" }); } catch (_) {}
      token = ""; me = null; localStorage.removeItem("crm_token"); showAuth(false);
    };
    $("btnCreateCustomer").onclick = async () => {
      try {
        const p = {
          name: $("cName").value.trim(), phone: $("cPhone").value.trim(), wechat: $("cWechat").value.trim(), city: $("cCity").value.trim(), owner: $("cOwner").value.trim(),
          channel: $("cChannel").value.trim(), level: $("cLevel").value.trim(), status: $("cStatus").value.trim(), source: $("cSource").value.trim(),
          tags: $("cTags").value.split(",").map((x)=>x.trim()).filter(Boolean), nextDate: $("cNextDate").value, amount: toNum($("cAmount").value), note: $("cNote").value.trim()
        };
        if (!p.name || !p.phone) throw new Error("姓名和电话必填");
        await req("/api/customers", { method: "POST", body: JSON.stringify(p) });
        notice($("createNotice"), "客户保存成功");
        ["cName","cPhone","cWechat","cCity","cOwner","cChannel","cLevel","cStatus","cSource","cTags","cNextDate","cAmount","cNote"].forEach((id)=>$(id).value="");
        await reloadData();
      } catch (e) { notice($("createNotice"), e.message, false); }
    };
    $("btnClearCustomer").onclick = () => ["cName","cPhone","cWechat","cCity","cOwner","cChannel","cLevel","cStatus","cSource","cTags","cNextDate","cAmount","cNote"].forEach((id)=>$(id).value="");
    $("btnAddFollow").onclick = async () => {
      try {
        const payload = { customerId: toNum($("fCustomerId").value), date: $("fDate").value || today(), content: $("fContent").value.trim(), nextDate: $("fNextDate2").value, result: $("fResult").value.trim(), status: $("fStatus2").value.trim() };
        if (!payload.customerId) throw new Error("客户ID必填");
        await req("/api/follows", { method: "POST", body: JSON.stringify(payload) });
        notice($("followNotice"), "跟进保存成功");
        ["fCustomerId","fResult","fNextDate2","fContent","fStatus2"].forEach((id)=>$(id).value=""); $("fDate").value=today();
        await reloadData();
      } catch (e) { notice($("followNotice"), e.message, false); }
    };
    $("btnClearFollow").onclick = () => ["fCustomerId","fResult","fNextDate2","fContent","fStatus2"].forEach((id)=>$(id).value="");
    $("btnApplyFilter").onclick = renderCustomers;
    $("btnClearFilter").onclick = () => { ["fKeyword","fOwner","fStatus","fCity"].forEach((id)=>$(id).value=""); renderCustomers(); };
    $("btnCalc").onclick = calcProfit;
    $("btnCalcReset").onclick = () => { ["pSell","pSupply","pComm","pAnchor","pShip","pPack","pReturn","pFixed","pQty"].forEach((id)=>$(id).value=""); $("pFixed").value="0"; $("pQty").value="100"; calcProfit(); };
    $("btnExportCustomers").onclick = () => exportCsv("客户数据.csv", filtered().map((c)=>({ id:c.id, name:c.name, phone:c.phone, wechat:c.wechat||"", city:c.city||"", owner:c.owner||"", channel:c.channel||"", level:c.level||"", status:c.status||"", source:c.source||"", tags:(c.tags||[]).join("|"), nextDate:c.nextDate||"", amount:Number(c.amount||0).toFixed(2), note:c.note||"" })));
    $("btnExportFollows").onclick = () => exportCsv("跟进数据.csv", follows.map((f)=>({ id:f.id, customerId:f.customerId, customerName:f.customerName||"", date:f.date||"", result:f.result||"", nextDate:f.nextDate||"", content:f.content||"" })));
    $("btnExportBackup").onclick = async () => {
      try {
        if (!me || me.role !== "boss") throw new Error("仅老板可导出");
        const data = await req("/api/backup/export", { method: "POST" });
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `客户系统备份_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(a.href);
      } catch (e) { alert(e.message); }
    };
    $("btnCreateUser").onclick = async () => {
      try {
        await req("/api/users", { method: "POST", body: JSON.stringify({ username:$("uName").value.trim(), password:$("uPass").value.trim(), role:$("uRole").value }) });
        notice($("teamNotice"), "账号创建成功");
      } catch (e) { notice($("teamNotice"), e.message, false); }
    };
    $("btnResetPass").onclick = async () => {
      try {
        await req("/api/users/reset-password", { method: "POST", body: JSON.stringify({ username:$("rUser").value.trim(), newPassword:$("rPass").value.trim() }) });
        notice($("teamNotice"), "密码重置成功");
      } catch (e) { notice($("teamNotice"), e.message, false); }
    };

    $("fDate").value = today();
    calcProfit();
    boot();
  </script>
</body>
</html>
