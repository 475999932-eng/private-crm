<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>私域客户管理系统（多人版）</title>
  <style>
    :root{--bg:#f4f7fb;--panel:#fff;--ink:#162032;--muted:#667085;--line:#dbe3ef;--acc:#155eef;--good:#0f766e;--danger:#b42318}
    *{box-sizing:border-box}
    body{margin:0;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#f8fbff,#eef4fb);color:var(--ink)}
    .app{max-width:1260px;margin:0 auto;padding:18px;display:grid;gap:12px}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
    h1{margin:0;font-size:20px}.sub{margin:4px 0 0;color:var(--muted);font-size:13px}
    button,input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
    button{cursor:pointer;background:#fff} button.primary{background:var(--acc);border-color:var(--acc);color:#fff} button.good{background:var(--good);border-color:var(--good);color:#fff}
    .grid{display:grid;grid-template-columns:1.3fr 1fr;gap:12px} .split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .toolbar{display:grid;grid-template-columns:1fr 130px 130px 130px 130px;gap:8px;margin-bottom:8px}
    .form{display:grid;gap:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    table{width:100%;border-collapse:collapse;font-size:13px} th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
    th{font-size:12px;color:var(--muted)} .muted{font-size:12px;color:var(--muted)}
    .kpis{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:8px}
    .kpi{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fbfdff} .kpi b{display:block;font-size:22px;margin-top:4px}
    .status{display:inline-block;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:600}
    .s-new{color:#155eef;background:#eef4ff}.s-follow{color:#9a3412;background:#fff5e8}.s-deal{color:#0f766e;background:#e9fbf8}.s-lost{color:#b42318;background:#fff1f1}
    .tag{display:inline-block;border:1px solid #b9d6ff;color:#114a9f;background:#eef5ff;border-radius:999px;padding:2px 8px;margin:2px 4px 2px 0;font-size:12px}
    .timeline{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fcfdff}
    .event{border-left:2px solid #bad3ff;padding:6px 8px;margin:0 0 8px 6px}
    .hidden{display:none}
    @media (max-width:980px){.grid,.split{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.row{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
<div class="app">
  <section class="panel" id="authPanel">
    <div class="top">
      <div><h1>私域客户管理系统（多人共享版）</h1><p class="sub">账号登录 + 统一数据库，多人看到同一份业务数据</p></div>
    </div>
    <div class="split" style="margin-top:10px;">
      <form id="loginForm" class="form panel" style="margin:0;">
        <h3 style="margin:0;">登录</h3>
        <input id="loginUser" placeholder="用户名" required />
        <input id="loginPass" type="password" placeholder="密码" required />
        <button class="primary" type="submit">登录</button>
      </form>
      <form id="registerForm" class="form panel" style="margin:0;">
        <h3 style="margin:0;">注册</h3>
        <input id="regUser" placeholder="用户名" required />
        <input id="regPass" type="password" placeholder="密码" required />
        <select id="regRole"><option value="staff">员工</option><option value="boss">老板</option></select>
        <button class="good" type="submit">创建账号</button>
      </form>
    </div>
    <div id="authMsg" class="muted" style="margin-top:8px;"></div>
  </section>

  <div id="appMain" class="hidden">
    <section class="panel top">
      <div>
        <h1 style="font-size:18px;">客户总览</h1>
        <p class="sub" id="whoami"></p>
      </div>
      <button id="logoutBtn">退出登录</button>
    </section>

    <section class="panel"><div class="kpis" id="kpis"></div></section>

    <section class="panel">
      <h2 style="margin:0 0 8px;">利润测算工具</h2>
      <div class="split">
        <div class="form">
          <div class="row"><input id="salePrice" type="number" step="0.01" placeholder="售价" value="99"><input id="supplyPrice" type="number" step="0.01" placeholder="供货价" value="45"></div>
          <div class="row"><input id="commissionRate" type="number" step="0.01" placeholder="佣金率(%)" value="15"><input id="streamerRate" type="number" step="0.01" placeholder="主播佣金率(%)" value="10"></div>
          <div class="row"><input id="shippingCost" type="number" step="0.01" placeholder="运费" value="6"><input id="packagingCost" type="number" step="0.01" placeholder="包装" value="2"></div>
          <div class="row"><input id="returnRate" type="number" step="0.01" placeholder="退货率(%)" value="8"><input id="fixedCost" type="number" step="0.01" placeholder="固定成本" value="5000"></div>
        </div>
        <div class="panel" style="margin:0;padding:8px;"><table><tbody id="profitResult"></tbody></table></div>
      </div>
    </section>

    <section class="grid">
      <section class="panel">
        <h2 style="margin:0 0 8px;">客户池</h2>
        <div class="toolbar">
          <input id="searchInput" placeholder="搜索客户名/手机/微信/标签..." />
          <select id="statusFilter"><option value="">全部状态</option><option>新线索</option><option>跟进中</option><option>已成交</option><option>已流失</option></select>
          <select id="levelFilter"><option value="">全部分层</option><option>A类高意向</option><option>B类培育中</option><option>C类待激活</option></select>
          <select id="ownerFilter"><option value="">全部负责人</option></select>
          <select id="channelFilter"><option value="">全部渠道</option></select>
        </div>
        <table><thead><tr><th>客户</th><th>微信号/城市</th><th>负责人/渠道</th><th>分层/状态</th><th>标签</th><th>上次跟进</th><th>下次计划</th><th>操作</th></tr></thead><tbody id="customerTbody"></tbody></table>
      </section>
      <section class="panel">
        <h2 style="margin:0 0 8px;">新增客户</h2>
        <form id="customerForm" class="form">
          <div class="row"><input required name="name" placeholder="客户姓名"><input required name="phone" placeholder="手机号"></div>
          <div class="row"><input name="wechat" placeholder="微信号"><input name="city" placeholder="城市"></div>
          <div class="row"><select name="level" required><option value="">客户分层</option><option>A类高意向</option><option>B类培育中</option><option>C类待激活</option></select><select name="status" required><option value="">跟进状态</option><option>新线索</option><option>跟进中</option><option>已成交</option><option>已流失</option></select></div>
          <div class="row"><input name="owner" placeholder="负责人（员工默认自己）"><input name="channel" placeholder="渠道"></div>
          <input name="source" placeholder="来源">
          <input name="tags" placeholder="标签，逗号分隔">
          <div class="row"><input name="nextDate" type="date"><input name="amount" type="number" step="0.01" placeholder="成交金额（可选）"></div>
          <textarea name="note" rows="3" placeholder="客户备注"></textarea>
          <button class="good" type="submit">保存客户</button>
        </form>
      </section>
    </section>

    <section class="grid">
      <section class="panel">
        <h2 style="margin:0 0 8px;">跟进记录</h2>
        <form id="followForm" class="form">
          <div class="row"><select id="followCustomer" required></select><input id="followDate" type="date" required></div>
          <textarea id="followContent" rows="3" placeholder="本次跟进内容"></textarea>
          <div class="row"><input id="nextFollowDate" type="date"><select id="followResult"><option>继续跟进</option><option>待报价</option><option>待付款</option><option>已成交</option><option>无意向</option></select></div>
          <button class="primary" type="submit">添加跟进记录</button>
        </form>
      </section>
      <section class="panel"><h2 style="margin:0 0 8px;">最近动态</h2><div id="timeline" class="timeline"></div></section>
    </section>
  </div>
</div>

<script>
const API = location.protocol === "file:" ? "http://127.0.0.1:8090" : "";
const today = new Date().toISOString().slice(0,10);
let token = localStorage.getItem("crm_token") || "";
let user = null;
let customers = [];
let follows = [];
const authMsg = document.getElementById("authMsg");

function setMsg(t){authMsg.textContent=t||""}
function hdr(){return token?{"Authorization":"Bearer "+token,"Content-Type":"application/json"}:{"Content-Type":"application/json"}}
async function req(path,opt={}){const r=await fetch(API+path,{...opt,headers:{...hdr(),...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||("HTTP "+r.status));return d}
function statusClass(s){if(s==="新线索")return"s-new";if(s==="跟进中")return"s-follow";if(s==="已成交")return"s-deal";return"s-lost"}
function tagsHtml(tags){return (tags||[]).map(t=>`<span class="tag">${t}</span>`).join("")}
function daysDiff(date){if(!date)return null;const d=new Date(date+"T00:00:00");const t=new Date(today+"T00:00:00");return Math.floor((d-t)/86400000)}
function updateAuthView(logged){
  document.getElementById("authPanel").classList.toggle("hidden",logged);
  document.getElementById("appMain").classList.toggle("hidden",!logged);
}
function renderKpis(){
  const total=customers.length, active=customers.filter(c=>c.status==="跟进中").length, deal=customers.filter(c=>c.status==="已成交").length, due=customers.filter(c=>c.nextDate&&daysDiff(c.nextDate)<=0).length;
  document.getElementById("kpis").innerHTML=[
    ["客户总数",total],["跟进中",active],["已成交",deal],["今日待跟进",due]
  ].map(([k,v])=>`<div class="kpi"><span class="muted">${k}</span><b>${v}</b></div>`).join("");
}
function renderOwnerChannelFilters(){
  const ownerSel=document.getElementById("ownerFilter"), channelSel=document.getElementById("channelFilter");
  const owners=[...new Set(customers.map(c=>(c.owner||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  const channels=[...new Set(customers.map(c=>(c.channel||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  const ov=ownerSel.value, cv=channelSel.value;
  ownerSel.innerHTML=`<option value="">全部负责人</option>`+owners.map(x=>`<option value="${x}">${x}</option>`).join("");
  channelSel.innerHTML=`<option value="">全部渠道</option>`+channels.map(x=>`<option value="${x}">${x}</option>`).join("");
  ownerSel.value=owners.includes(ov)?ov:""; channelSel.value=channels.includes(cv)?cv:"";
}
function renderTable(){
  const kw=document.getElementById("searchInput").value.trim().toLowerCase();
  const sf=document.getElementById("statusFilter").value, lf=document.getElementById("levelFilter").value, of=document.getElementById("ownerFilter").value, cf=document.getElementById("channelFilter").value;
  const rows=customers.filter(c=>{
    const hit=!kw||[c.name,c.phone,c.wechat,c.city,c.owner,c.channel,c.level,c.status,c.source,c.note,...(c.tags||[])].join("|").toLowerCase().includes(kw);
    return hit&&(!sf||c.status===sf)&&(!lf||c.level===lf)&&(!of||c.owner===of)&&(!cf||c.channel===cf);
  }).sort((a,b)=>(a.nextDate||"9999").localeCompare(b.nextDate||"9999"));
  const tb=document.getElementById("customerTbody");
  tb.innerHTML=rows.map(c=>{const d=daysDiff(c.nextDate);const next=!c.nextDate?"-":`${c.nextDate}${d<0?"（逾期）":d===0?"（今天）":""}`;return `<tr>
    <td><b>${c.name}</b><div class="muted">${c.phone}<br>${c.source||"-"}</div></td>
    <td>${c.wechat||"-"}<div class="muted">${c.city||"-"}</div></td>
    <td>${c.owner||"-"}<div class="muted">${c.channel||"-"}</div></td>
    <td><div>${c.level||"-"}</div><span class="status ${statusClass(c.status)}">${c.status||"-"}</span></td>
    <td>${tagsHtml(c.tags)}</td><td>${c.lastFollow||"-"}</td><td>${next}</td><td><button data-del="${c.id}">删除</button></td></tr>`}).join("");
  tb.querySelectorAll("button[data-del]").forEach(b=>b.addEventListener("click",async()=>{if(!confirm("确认删除该客户？"))return;await req("/api/customers/"+b.dataset.del,{method:"DELETE"});await loadData();}));
}
function renderFollowSelect(){
  const s=document.getElementById("followCustomer");
  s.innerHTML=`<option value="">选择客户</option>`+customers.map(c=>`<option value="${c.id}">${c.name} · ${c.phone}</option>`).join("");
}
function renderTimeline(){
  const list=[...follows].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,40);
  const el=document.getElementById("timeline");
  el.innerHTML=list.length?list.map(x=>`<div class="event"><b>${x.customerName}</b><div class="muted">${x.date} · ${x.result}${x.nextDate?` · 下次：${x.nextDate}`:""}</div><div>${x.content||"-"}</div></div>`).join(""):`<div class="muted">还没有跟进记录。</div>`;
}
function n(id){const v=Number(document.getElementById(id).value);return Number.isFinite(v)?v:0}
function currency(x){return "¥"+(Number.isFinite(x)?x:0).toFixed(2)}
function percent(x){return (Number.isFinite(x)?x:0).toFixed(2)+"%"}
function renderProfit(){
  const sale=n("salePrice"), supply=n("supplyPrice"), com=n("commissionRate")/100, streamer=n("streamerRate")/100, shipping=n("shippingCost"), pack=n("packagingCost"), ret=n("returnRate")/100, fixed=n("fixedCost");
  const comAmt=sale*com, streamerAmt=sale*streamer, varCost=supply+comAmt+streamerAmt+shipping+pack, gross=sale-supply, netNoRet=sale-varCost, expNet=netNoRet*(1-ret), grossMargin=sale>0?gross/sale:0, netMargin=sale>0?expNet/sale:0, be=expNet>0?Math.ceil(fixed/expNet):Infinity;
  const rows=[["单件毛利",currency(gross)],["毛利率",percent(grossMargin*100)],["单件净利（含退货率）",currency(expNet)],["净利率（含退货率）",percent(netMargin*100)],["单件总成本",currency(varCost)],["保本销量",Number.isFinite(be)?`${be} 单`:"无法保本（单件净利<=0）"]];
  document.getElementById("profitResult").innerHTML=rows.map(([k,v])=>`<tr><th style="width:50%">${k}</th><td><b>${v}</b></td></tr>`).join("");
}
function renderAll(){document.getElementById("whoami").textContent=`当前账号：${user.username}（${user.role==="boss"?"老板":"员工"}）`;renderKpis();renderOwnerChannelFilters();renderTable();renderFollowSelect();renderTimeline();renderProfit();}

async function loadData(){const c=await req("/api/customers");const f=await req("/api/follows");customers=c.customers||[];follows=f.follows||[];renderAll();}
async function bootWithToken(){
  if(!token){updateAuthView(false);return;}
  try{const me=await req("/api/me");user=me.user;updateAuthView(true);await loadData();}catch(_){localStorage.removeItem("crm_token");token="";updateAuthView(false);}
}

document.getElementById("loginForm").addEventListener("submit",async(e)=>{e.preventDefault();try{const d=await req("/api/login",{method:"POST",body:JSON.stringify({username:loginUser.value.trim(),password:loginPass.value})});token=d.token;localStorage.setItem("crm_token",token);user=d.user;setMsg("");updateAuthView(true);await loadData();}catch(err){setMsg("登录失败："+err.message)}});
document.getElementById("registerForm").addEventListener("submit",async(e)=>{e.preventDefault();try{await req("/api/register",{method:"POST",body:JSON.stringify({username:regUser.value.trim(),password:regPass.value,role:regRole.value})});setMsg("注册成功，请用新账号登录。");registerForm.reset();}catch(err){setMsg("注册失败："+err.message)}});
document.getElementById("logoutBtn").addEventListener("click",async()=>{try{await req("/api/logout",{method:"POST"});}catch(_){ } localStorage.removeItem("crm_token");token="";user=null;updateAuthView(false);});

document.getElementById("customerForm").addEventListener("submit",async(e)=>{
  e.preventDefault();
  const fd=new FormData(e.target);
  const payload={
    name:(fd.get("name")||"").trim(), phone:(fd.get("phone")||"").trim(), wechat:(fd.get("wechat")||"").trim(), city:(fd.get("city")||"").trim(),
    owner:(fd.get("owner")||"").trim(), channel:(fd.get("channel")||"").trim(), level:fd.get("level")||"", status:fd.get("status")||"",
    source:(fd.get("source")||"").trim(), tags:(fd.get("tags")||"").split(",").map(s=>s.trim()).filter(Boolean),
    nextDate:fd.get("nextDate")||"", amount:Number(fd.get("amount")||0), note:(fd.get("note")||"").trim(), lastFollow:""
  };
  await req("/api/customers",{method:"POST",body:JSON.stringify(payload)});
  e.target.reset();
  await loadData();
});

document.getElementById("followForm").addEventListener("submit",async(e)=>{
  e.preventDefault();
  const cid=Number(document.getElementById("followCustomer").value||0); if(!cid)return;
  const result=document.getElementById("followResult").value;
  let status="跟进中"; if(result==="已成交")status="已成交"; if(result==="无意向")status="已流失";
  const payload={customerId:cid,date:document.getElementById("followDate").value||today,content:document.getElementById("followContent").value.trim(),nextDate:document.getElementById("nextFollowDate").value||"",result,status};
  await req("/api/follows",{method:"POST",body:JSON.stringify(payload)});
  e.target.reset(); document.getElementById("followDate").value=today;
  await loadData();
});

["searchInput","statusFilter","levelFilter","ownerFilter","channelFilter"].forEach(id=>document.getElementById(id).addEventListener("input",renderTable));
["salePrice","supplyPrice","commissionRate","streamerRate","shippingCost","packagingCost","returnRate","fixedCost"].forEach(id=>document.getElementById(id).addEventListener("input",renderProfit));

document.getElementById("followDate").value=today;
bootWithToken();
</script>
</body>
</html>
